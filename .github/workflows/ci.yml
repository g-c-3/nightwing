name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # Selects which of the two manually-triggered pipelines below
      # (`tuning-pipeline`, `pgo-build`) actually runs. Without this,
      # both jobs share the same `if: github.event_name ==
      # 'workflow_dispatch'` condition and a single "Run workflow" click
      # would kick off BOTH every time -- a real gap noticed only after
      # this workflow was already written (see docs/DECISIONS.md), not
      # something intentional about the original two-job design. `type:
      # choice` renders as a dropdown in GitHub's own "Run workflow" UI
      # (web and mobile browser alike), so picking the wrong one isn't
      # possible the way a free-text field would allow.
      pipeline:
        description: "Which manually-triggered pipeline to run"
        required: true
        type: choice
        options:
          - tuning
          - pgo
          - sprt
        default: tuning
      selfplay_games:
        description: "nightwing_selfplay: number of self-play games to generate training data from"
        required: false
        default: "5000"
      selfplay_search_depth:
        description: "nightwing_selfplay/nightwing_match: fixed search depth used for every move (shared by both tools so training/eval and the strength-comparison match use the same search strength)"
        required: false
        default: "4"
      selfplay_random_opening_plies:
        description: "nightwing_selfplay/nightwing_match: random plies played at the start of each game before real search takes over, for opening variety"
        required: false
        default: "8"
      selfplay_max_plies:
        description: "nightwing_selfplay/nightwing_match: safety cap on game length (plies) before a game is abandoned as a draw"
        required: false
        default: "200"
      tune_iterations:
        description: "nightwing_tune: finite-difference gradient descent iterations (used for material mode and all 6 term modes below — PSQT included, though its own tune_psqt() uses an analytic gradient rather than finite differences, tune.h's own doc comment on why)"
        required: false
        default: "200"
      match_games:
        description: "nightwing_match: number of games played between tuned weights and eval::default_material_weights()"
        required: false
        default: "400"
      sprt_elo0:
        description: "nightwing_sprt: H0 Elo bound (the change is no better than this)"
        required: false
        default: "0"
      sprt_elo1:
        description: "nightwing_sprt: H1 Elo bound (the change is at least this good)"
        required: false
        default: "5"
      sprt_batch_size:
        description: "nightwing_sprt: games played per SPRT check (should be even)"
        required: false
        default: "20"
      sprt_max_games:
        description: "nightwing_sprt: hard safety cap on total games if neither SPRT bound is ever crossed"
        required: false
        default: "2000"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            build_type: Release
          - os: ubuntu-latest
            os_name: Linux
            build_type: Debug
          - os: macos-latest
            os_name: macOS
            build_type: Release
          - os: macos-latest
            os_name: macOS
            build_type: Debug
          - os: windows-latest
            os_name: Windows
            build_type: Release
          - os: windows-latest
            os_name: Windows
            build_type: Debug

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_name }} ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ninja needs cl.exe on PATH explicitly -- the Visual Studio generator
      # locates MSVC automatically via its own toolchain-discovery logic,
      # Ninja has no such mechanism and just invokes whatever compiler it's
      # given. egor-tensin/vs-shell does this (a real, actively-used
      # alternative to the more commonly-referenced ilammy/msvc-dev-cmd,
      # switched to specifically because it's implemented in PowerShell, not
      # Node.js -- ilammy/msvc-dev-cmd still declares itself as a Node 20
      # action, which is what brought the "Node.js 20 is deprecated"
      # annotation back after this workflow's earlier, separate Node 20 fix
      # -- actions/checkout@v7, 2026-08-16 entry -- covered a different
      # action entirely). Windows-only; Linux/macOS keep the default
      # Makefiles generator, which already works correctly and isn't part of
      # this change.
      - name: Set up MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      # Ninja's actual availability on GitHub-hosted Windows runners has
      # changed over time and isn't something to assume (see
      # docs/DECISIONS.md's 2026-08-18 entry on this switch for the
      # investigation) -- installing it explicitly via pip is the most
      # reliable option: Python/pip is guaranteed present on every
      # GitHub-hosted runner, and PyPI's `ninja` package is a real binary,
      # not a wrapper around something that might not be there.
      - name: Install Ninja (Windows only)
        if: runner.os == 'Windows'
        run: pip install ninja

      # Windows uses Ninja (see docs/DECISIONS.md's 2026-08-18 entry: the
      # Visual Studio generator represents Debug's compiler flags as
      # structured per-file MSBuild XML properties rather than a plain
      # command line, which is what made board/attacks.cpp's per-file
      # optimization override in src/CMakeLists.txt unreliable to reason
      # about there -- Ninja produces the same flat, literal compiler
      # command line Linux/macOS's Makefiles generator already does, which
      # is what that override is designed around). Linux/macOS are
      # unchanged, using CMake's default generator for their platform.
      - name: Configure CMake
        run: cmake -B build ${{ runner.os == 'Windows' && '-G Ninja' || '' }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNIGHTWING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

      # `ctest --output-on-failure` (the step above) only ever prints a
      # test's own stdout when that test FAILS -- for the regression
      # bench (tests/bench_tests.cpp, `[bench]` tag; docs/ROADMAP.md's
      # own "node-count/strength tracked in SESSIONS.md per change"
      # practice), the whole point is reading its printed `BENCH ...`
      # node-count lines from a PASSING run, which the step above can
      # never surface -- this was silently true from the day that
      # practice was adopted, only noticed once a session actually went
      # looking for those lines in a real CI log and found nothing (see
      # docs/SESSIONS.md, 2026-08-26 (3)/(4)). `-V` (verbose) forces
      # ctest to print a test's output regardless of pass/fail. Scoped to
      # a single matrix leg (Linux Release, chosen arbitrarily among the
      # six -- search is deterministic, so node counts are the same
      # figures the OS/build-type wouldn't be expected to change) rather
      # than repeated six times: the bench numbers are read by a human
      # updating docs/SESSIONS.md, not asserted on by any test, so one
      # copy of them is all that's ever actually useful.
      - name: Print regression bench (Linux Release only — see comment above)
        if: matrix.os_name == 'Linux' && matrix.build_type == 'Release'
        working-directory: build
        run: ctest -R bench -V --build-config ${{ matrix.build_type }}

  # ROADMAP.md Phase 5's final item ("Tuned weights committed, before/after
  # strength comparison logged") needs a real large-scale run: thousands of
  # nightwing_selfplay games piped into nightwing_tune, then a
  # nightwing_match comparison of the tuned weights against
  # eval::default_material_weights(). This is compute-heavy (thousands of
  # fixed-depth searches), not something to hand-run in a chat sandbox with
  # per-command time limits — src/tuner/selfplay_main.cpp's,
  # src/tuner/tune_main.cpp's, and src/tuner/match_main.cpp's own header
  # comments already document the intended venue for this as "a GitHub
  # Actions workflow_dispatch job", extending this project's existing
  # "GitHub Actions handles ALL building" convention to "and ALL running of
  # anything compute-heavy like this too" (see docs/DECISIONS.md's
  # 2026-08-31 entry for this job itself). Manually triggered only
  # (`workflow_dispatch`, not `push`/
  # `pull_request`) since this is a deliberate, occasional data-generation
  # run, not a per-commit correctness check — it doesn't gate CI and CI's
  # own green status doesn't depend on it. Linux Release only: search is
  # deterministic given a seed, so the OS/build-type matrix build-and-test
  # already exists for isn't a meaningful axis for a strength-tuning run,
  # and running this on all 6 legs would be 6x the compute for zero
  # additional signal.
  tuning-pipeline:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'tuning'
    runs-on: ubuntu-latest
    name: Tuning pipeline (selfplay -> tune -> match)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tests aren't needed for this job — it only runs the three tuner/
      # executables (nightwing_selfplay/nightwing_tune/nightwing_match),
      # none of which are part of the Catch2 test binary. Skipping
      # NIGHTWING_BUILD_TESTS avoids an unnecessary Catch2 FetchContent +
      # compile on a job that's already going to spend most of its time in
      # the actual self-play/tune/match run below, not in the build step.
      - name: Configure CMake (Release, no tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF

      - name: Build tuner executables
        run: cmake --build build --config Release --parallel --target nightwing_selfplay nightwing_tune nightwing_match

      # Positional args, per each tool's own header comment:
      #   nightwing_selfplay [num_games] [base_seed] [search_depth] [random_opening_plies] [max_plies]
      #   nightwing_tune     [iterations] [learning_rate] [finite_diff_epsilon] [sigmoid_scale]
      #   nightwing_match    [num_games] [base_seed] [search_depth] [random_opening_plies] [max_plies]
      # base_seed is fixed (1) for both selfplay and match so a re-run of
      # this workflow with unchanged inputs is exactly reproducible.
      # nightwing_tune's own progress/loss-curve output goes to stderr, not
      # stdout (match_main.cpp's own header comment) — tuned_weights.txt
      # below only ever receives the five "pawn_mg=... pawn_eg=..." lines
      # nightwing_match expects on its stdin.
      - name: Run self-play -> tune -> match pipeline
        working-directory: build
        run: |
          set -euo pipefail
          echo "== nightwing_selfplay: ${{ inputs.selfplay_games }} games =="
          ./src/nightwing_selfplay \
            "${{ inputs.selfplay_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            > training_data.txt
          wc -l training_data.txt

          echo "== nightwing_tune: ${{ inputs.tune_iterations }} iterations =="
          ./src/nightwing_tune "${{ inputs.tune_iterations }}" \
            < training_data.txt > tuned_weights.txt
          cat tuned_weights.txt

          echo "== nightwing_match: tuned vs. default_material_weights(), ${{ inputs.match_games }} games =="
          ./src/nightwing_match \
            "${{ inputs.match_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            < tuned_weights.txt | tee match_result.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuning-pipeline-results
          path: |
            build/training_data.txt
            build/tuned_weights.txt
            build/match_result.txt
          retention-days: 30

  # ROADMAP.md's "Actually run tune_mobility()/tune_space()/tune_threats()/
  # tune_king_safety()/tune_pawns() against real self-play data" item, PLUS
  # PSQT (`--psqt`, `tune_psqt()`) added to this same matrix rather than
  # left out: PSQT was already fully built and CLI-wired (Tier 0 Step 6,
  # tune_main.cpp's own `--psqt` flag) but had never actually been added
  # to this workflow at all — a real gap, not a deliberate scoping choice,
  # noticed only when asked directly "how to Texel-tune the WHOLE thing in
  # GitHub Actions" and checked against this file rather than assumed
  # already covered. PSQT fits this same matrix cleanly despite being
  # algorithmically different (analytic gradient, tune.h's own doc
  # comment, vs. finite-difference for the other five): tune_main.cpp's
  # own CLI dispatch treats `--psqt` exactly like any other mode flag
  # (same positional-argument slot, same internal `TuneConfig::learning_rate`
  # override handled inside tune_main.cpp itself, not something this
  # workflow needs to special-case), and — measured directly, not assumed
  # — PSQT's own per-iteration cost is roughly `1/(2N+1)` of a
  # finite-difference term's at the same N, since an analytic gradient is
  # ONE pass over the training data per iteration rather than `2N+1`
  # (tune.h's own header comment on why PSQT specifically got an analytic
  # path in the first place): ~26 minutes at this workflow's own
  # 5000-game/200-iteration defaults, the cheapest leg in this entire
  # matrix despite having by far the most parameters (768). No
  # `nightwing_match` counterpart for PSQT either, same reason as the
  # other five (`tuner::match.h`'s own `eval::MaterialWeights`-only
  # scope) — and PSQT's own tuned result is a per-square 8x8 grid, not
  # `name=value` lines (`print_psqt_field()`, tune_main.cpp), written to
  # stderr rather than stdout, so `tuned_weights.txt` for this leg will be
  # an empty file; that's expected, not a bug — the real output is in
  # `tune_stderr.txt`.
  #
  # ROADMAP.md's "Actually run tune_mobility()/tune_space()/tune_threats()/
  # tune_king_safety()/tune_pawns() against real self-play data" item. A
  # SEPARATE job per mode (matrix strategy below), not extra steps tacked
  # onto tuning-pipeline above, for a real, measured reason: a single
  # GitHub-hosted job has a hard 6-hour execution ceiling, and these five
  # terms' own parameter counts vary by an order of magnitude (space: 2,
  # pawns: 59) — compute_loss()'s own cost scales with TRAINING POSITION
  # COUNT, walked 2*N+1 times per tuning iteration (finite-difference), so
  # a 59-parameter table costs ~30x a 2-parameter one at the same
  # iteration count. Measured directly (this session, a real build, a
  # 732-position corpus, 20 iterations per mode) and scaled linearly to
  # this workflow's own 5000-game/200-iteration defaults: pawns alone
  # comes out to roughly 2.5-3 hours by itself, and mobility+space+
  # threats+king-safety+pawns run SEQUENTIALLY in one job (as an earlier
  # version of this workflow briefly had it) sums to close enough to 6
  # hours — before self-play/material-tune/match's own time, and before
  # checkout/build/artifact-upload overhead — that a real dispatch risks
  # the job being killed by the platform ceiling with NOTHING uploaded,
  # including modes that finished fine minutes earlier. Splitting into
  # independent jobs fixes this two ways at once: GitHub runs independent
  # jobs concurrently (account concurrency limits permitting), so total
  # WALL-CLOCK time drops to roughly the slowest single mode (pawns, ~3
  # hours) instead of the sum of all six: and each job gets its own full
  # 6-hour ceiling and its own artifact upload, so one mode running long
  # or failing doesn't cost the others their results.
  #
  # Each job regenerates training_data.txt itself with the SAME
  # selfplay_games/selfplay_search_depth/selfplay_random_opening_plies/
  # selfplay_max_plies inputs and the same fixed base_seed=1 the
  # tuning-pipeline job above uses — nightwing_selfplay is fully
  # deterministic given identical inputs (tuner/selfplay.h's own header
  # comment), so this produces the EXACT SAME corpus tuning-pipeline's own
  # material run trains against, not a separately-drawn, not-directly-
  # comparable one, without needing cross-job artifact hand-off (a real
  # option too, but a second job dependency/download step for a
  # regeneration this cheap — ~6 minutes of this job's own multi-hour
  # budget — isn't worth the added coupling). No nightwing_match
  # counterpart here: tuner::match.h is deliberately scoped to
  # eval::MaterialWeights only (its own header comment) — generalizing it
  # is a distinct, not-yet-scoped future item, out of reach of this one.
  tuning-pipeline-term:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'tuning'
    runs-on: ubuntu-latest
    # `name:` is the string GitHub's own run-summary UI shows per matrix
    # leg (the "Matrix: tuning-pipeline-term" list on the Actions run
    # page) -- `matrix.label` (a small, explicit include-list below,
    # NOT derived from `matrix.mode` via string manipulation, since
    # GitHub Actions expressions have no built-in capitalize()) exists
    # so that list reads as a short, unambiguous "Mobility"/"Space"/
    # "Threats"/"King-safety"/"Pawns"/"PSQT" rather than a long, mobile-
    # UI-truncating "Tuning pipeline, king-saf..." this job's own name
    # used before. `matrix.mode` (still the actual `--mode` value the
    # step below passes to nightwing_tune) is unchanged.
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: psqt
            label: PSQT
          - mode: mobility
            label: Mobility
          - mode: space
            label: Space
          - mode: threats
            label: Threats
          - mode: king-safety
            label: King-safety
          - mode: pawns
            label: Pawns

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake (Release, no tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF

      - name: Build tuner executables
        run: cmake --build build --config Release --parallel --target nightwing_selfplay nightwing_tune

      # Same positional args as tuning-pipeline's own step above; see that
      # step's own comment for the full reference. nightwing_tune's
      # `--${{ matrix.mode }}` must be its own separate argument, before
      # `tune_iterations` (tune_main.cpp's own CLI-mode-must-be-argv[1]
      # convention, tuner/tune_main.cpp's own header comment).
      - name: Run self-play -> tune (${{ matrix.mode }}) pipeline
        working-directory: build
        run: |
          set -euo pipefail
          echo "== nightwing_selfplay: ${{ inputs.selfplay_games }} games =="
          ./src/nightwing_selfplay \
            "${{ inputs.selfplay_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            > training_data.txt
          wc -l training_data.txt

          echo "== nightwing_tune --${{ matrix.mode }}: ${{ inputs.tune_iterations }} iterations =="
          ./src/nightwing_tune "--${{ matrix.mode }}" "${{ inputs.tune_iterations }}" \
            < training_data.txt > tuned_weights.txt 2> tune_stderr.txt
          cat tuned_weights.txt
          tail -40 tune_stderr.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuning-pipeline-${{ matrix.mode }}-results
          path: |
            build/tuned_weights.txt
            build/tune_stderr.txt
          retention-days: 30

  # ROADMAP.md Phase 8's "PGO build pipeline" item. Manually triggered
  # only (`workflow_dispatch`, same rationale as `tuning-pipeline` above)
  # -- a two-stage PGO build is a deliberate, occasional release-quality
  # step, not a per-commit correctness check, and doesn't gate regular
  # CI. Linux only: PGO here is GCC/Clang-only by design (see
  # CMakeLists.txt's own NIGHTWING_PGO_PHASE comment for why MSVC is out
  # of scope this session), and a single representative platform is
  # enough to validate the pipeline itself works — this job produces a
  # downloadable artifact for whoever wants the actual optimized binary,
  # not a cross-platform correctness matrix (build-and-test above
  # already covers that, without PGO).
  #
  # CRITICAL: both cmake invocations below target the SAME build
  # directory (`build`) and never rename the `nightwing` executable
  # target — see CMakeLists.txt's own NIGHTWING_PGO_PHASE comment for
  # why either one breaks GCC's own profile-file-to-binary-name
  # association silently (produces a working but NON-PGO-optimized
  # binary with a full set of masked "missing profile" warnings, not a
  # build failure — the kind of mistake that's easy to ship unnoticed).
  pgo-build:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'pgo'
    runs-on: ubuntu-latest
    name: PGO build pipeline (generate -> train -> use -> verify)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake (Release, PGO generate phase)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF -DNIGHTWING_PGO_PHASE=generate

      - name: Build instrumented engine
        run: cmake --build build --config Release --parallel --target nightwing

      # Training workload: the same fixed bench positions this project
      # already uses for regression tracking (src/bench_positions.h),
      # plus a couple of ordinary `go` searches from both the starting
      # position and a short reply, specifically so the opening book
      # (book.cpp — `bench` alone never touches it, since
      # search_fixed_depth() bypasses book entirely) also gets real
      # profile coverage, not just left to `-Wno-missing-profile` to
      # paper over. Verified directly, in a development sandbox before
      # this job was written, that this exact combination already
      # exercises every single .cpp file in nightwing_lib.
      - name: Run training workload
        working-directory: build
        run: |
          ./src/nightwing bench
          printf 'uci\nposition startpos\ngo depth 8\nposition startpos moves e2e4 e7e5\ngo depth 8\nquit\n' | ./src/nightwing

      # Reconfigures the SAME build directory in place (this step's own
      # job-level comment above has the full reasoning on why this
      # matters) -- also turns tests on now, so the verification step
      # below builds and runs the PGO-optimized library, not a second,
      # separate non-PGO copy of it.
      - name: Reconfigure CMake (PGO use phase, tests on)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=ON -DNIGHTWING_PGO_PHASE=use

      - name: Rebuild optimized engine and test suite
        run: cmake --build build --config Release --parallel

      # Confirms the PGO-optimized nightwing_lib is still correct, not
      # just faster -- PGO only changes codegen/optimization decisions,
      # never program logic, so every existing test should still pass
      # unchanged; a failure here would mean something about this
      # pipeline itself (not an ordinary code change) broke correctness.
      - name: Test PGO-optimized build
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      # `bench`'s own "Nodes searched" total is a genuine correctness
      # cross-check, not just informational here: PGO must never change
      # WHAT the engine computes, only how fast — an unexpected total
      # here (versus the plain, non-PGO build-and-test job's own bench
      # numbers, docs/SESSIONS.md) would indicate this pipeline
      # introduced a real behavioral difference, not just a speed one.
      - name: Run bench on the PGO-optimized binary
        working-directory: build
        run: ./src/nightwing bench

      - name: Upload PGO-optimized binary
        uses: actions/upload-artifact@v4
        with:
          name: nightwing-pgo-linux
          path: build/src/nightwing
          retention-days: 30

  # ROADMAP.md Phase 8's "SPRT testing setup/process for validating future
  # changes" item. Manually triggered only (`workflow_dispatch`, same
  # rationale as `tuning-pipeline`/`pgo-build` above) — an SPRT run is a
  # deliberate, occasional strength-validation step for a specific proposed
  # change, not a per-commit correctness check. Linux Release only, same
  # "search is deterministic given a seed, cross-platform isn't a
  # meaningful axis here" reasoning as `tuning-pipeline`.
  #
  # This job demonstrates the actual end-to-end process a future session
  # (or person) can reuse to validate ANY proposed change with a real
  # accept/reject decision rather than a fixed-game match's bare point
  # estimate (tuner::match.h's own header comment on the difference,
  # tuner::sprt.h's own header comment on the method): here, self-play ->
  # tune produces a candidate weight vector, and nightwing_sprt (not
  # nightwing_match) is what decides whether it's actually worth adopting.
  # The identical nightwing_sprt tool works just as well standing alone,
  # fed any other candidate eval::MaterialWeights on stdin — the self-play/
  # tune steps above it in this job are one example producer of a
  # candidate to test, not a requirement of the SPRT process itself.
  sprt-test:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'sprt'
    runs-on: ubuntu-latest
    name: SPRT pipeline (selfplay -> tune -> sprt)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake (Release, no tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF

      - name: Build tuner executables
        run: cmake --build build --config Release --parallel --target nightwing_selfplay nightwing_tune nightwing_sprt

      # Positional args:
      #   nightwing_selfplay [num_games] [base_seed] [search_depth] [random_opening_plies] [max_plies]
      #   nightwing_tune     [iterations] [learning_rate] [finite_diff_epsilon] [sigmoid_scale]
      #   nightwing_sprt     [elo0] [elo1] [alpha] [beta] [batch_size] [max_games]
      #                      [base_seed] [search_depth] [random_opening_plies] [max_plies]
      # (sprt_main.cpp's own header comment has the full list.) base_seed
      # is fixed (1) for both selfplay and the SPRT run so a re-run of this
      # workflow with unchanged inputs is exactly reproducible. alpha/beta
      # are left at nightwing_sprt's own defaults (0.05/0.05, the
      # conventional Fishtest-style error rates) — not exposed as separate
      # workflow_dispatch inputs, since changing them changes what
      # "accept"/"reject" statistically MEANS, not just how long the test
      # runs; the four inputs that are exposed (elo0/elo1/batch_size/
      # max_games) are the ones that vary run-to-run for a genuinely
      # different question being asked, not the test's own error-rate
      # calibration.
      - name: Run self-play -> tune -> SPRT pipeline
        working-directory: build
        run: |
          set -euo pipefail
          echo "== nightwing_selfplay: ${{ inputs.selfplay_games }} games =="
          ./src/nightwing_selfplay \
            "${{ inputs.selfplay_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            > training_data.txt
          wc -l training_data.txt

          echo "== nightwing_tune: ${{ inputs.tune_iterations }} iterations =="
          ./src/nightwing_tune "${{ inputs.tune_iterations }}" \
            < training_data.txt > tuned_weights.txt
          cat tuned_weights.txt

          echo "== nightwing_sprt: tuned vs. default_material_weights(), elo0=${{ inputs.sprt_elo0 }} elo1=${{ inputs.sprt_elo1 }} =="
          ./src/nightwing_sprt \
            "${{ inputs.sprt_elo0 }}" "${{ inputs.sprt_elo1 }}" 0.05 0.05 \
            "${{ inputs.sprt_batch_size }}" "${{ inputs.sprt_max_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            < tuned_weights.txt | tee sprt_result.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprt-pipeline-results
          path: |
            build/training_data.txt
            build/tuned_weights.txt
            build/sprt_result.txt
          retention-days: 30
