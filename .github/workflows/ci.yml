name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            build_type: Release
          - os: ubuntu-latest
            os_name: Linux
            build_type: Debug
          - os: macos-latest
            os_name: macOS
            build_type: Release
          - os: macos-latest
            os_name: macOS
            build_type: Debug
          - os: windows-latest
            os_name: Windows
            build_type: Release
          - os: windows-latest
            os_name: Windows
            build_type: Debug

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_name }} ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ninja needs cl.exe on PATH explicitly -- the Visual Studio generator
      # locates MSVC automatically via its own toolchain-discovery logic,
      # Ninja has no such mechanism and just invokes whatever compiler it's
      # given. egor-tensin/vs-shell does this (a real, actively-used
      # alternative to the more commonly-referenced ilammy/msvc-dev-cmd,
      # switched to specifically because it's implemented in PowerShell, not
      # Node.js -- ilammy/msvc-dev-cmd still declares itself as a Node 20
      # action, which is what brought the "Node.js 20 is deprecated"
      # annotation back after this workflow's earlier, separate Node 20 fix
      # -- actions/checkout@v7, 2026-08-16 entry -- covered a different
      # action entirely). Windows-only; Linux/macOS keep the default
      # Makefiles generator, which already works correctly and isn't part of
      # this change.
      - name: Set up MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      # Ninja's actual availability on GitHub-hosted Windows runners has
      # changed over time and isn't something to assume (see
      # docs/DECISIONS.md's 2026-08-18 entry on this switch for the
      # investigation) -- installing it explicitly via pip is the most
      # reliable option: Python/pip is guaranteed present on every
      # GitHub-hosted runner, and PyPI's `ninja` package is a real binary,
      # not a wrapper around something that might not be there.
      - name: Install Ninja (Windows only)
        if: runner.os == 'Windows'
        run: pip install ninja

      # Windows uses Ninja (see docs/DECISIONS.md's 2026-08-18 entry: the
      # Visual Studio generator represents Debug's compiler flags as
      # structured per-file MSBuild XML properties rather than a plain
      # command line, which is what made board/attacks.cpp's per-file
      # optimization override in src/CMakeLists.txt unreliable to reason
      # about there -- Ninja produces the same flat, literal compiler
      # command line Linux/macOS's Makefiles generator already does, which
      # is what that override is designed around). Linux/macOS are
      # unchanged, using CMake's default generator for their platform.
      - name: Configure CMake
        run: cmake -B build ${{ runner.os == 'Windows' && '-G Ninja' || '' }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNIGHTWING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # Diagnostic, Windows Debug only: confirmed via the previous run's
      # build.ninja inspection that board/attacks.cpp's -O2 override
      # (src/CMakeLists.txt) genuinely reaches the compiler under Ninja+MSVC
      # (MSVC even logged "overriding '/Od' with '/O2'", D9025, exactly the
      # rightmost-wins resolution expected once /RTC1 was removed) -- so the
      # earlier hypothesis that the flag wasn't applying was wrong. Test
      # names elsewhere in the suite reference behavior conditional on "when
      # the host CPU supports BMI2" (this codebase has a runtime BMI2/PEXT
      # dispatch, board/attacks.cpp -- see src/support/cpu_features.h), so
      # the new lead is that THIS runner's CPU may not support BMI2, making
      # init_magic_bitboards() take a genuinely slower algorithmic path no
      # amount of optimization level can compensate for. This runs the
      # relevant test directly (bypassing ctest, which only shows output for
      # FAILING tests, and this one passes) with Catch2's -s flag to surface
      # its temporary WARN() diagnostic (tests/test_smoke.cpp) reporting
      # what was actually detected. Temporary: remove both this step and
      # that WARN() once resolved (see docs/DECISIONS.md's 2026-08-19
      # entries).
      - name: Show detected CPU features (Windows Debug diagnostic)
        if: runner.os == 'Windows' && matrix.build_type == 'Debug'
        run: build\tests\nightwing_tests.exe "CPU feature detection runs without crashing" -s

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}
