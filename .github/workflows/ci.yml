name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # Selects which of the two manually-triggered pipelines below
      # (`tuning-pipeline`, `pgo-build`) actually runs. Without this,
      # both jobs share the same `if: github.event_name ==
      # 'workflow_dispatch'` condition and a single "Run workflow" click
      # would kick off BOTH every time -- a real gap noticed only after
      # this workflow was already written (see docs/DECISIONS.md), not
      # something intentional about the original two-job design. `type:
      # choice` renders as a dropdown in GitHub's own "Run workflow" UI
      # (web and mobile browser alike), so picking the wrong one isn't
      # possible the way a free-text field would allow.
      pipeline:
        description: "Which manually-triggered pipeline to run"
        required: true
        type: choice
        options:
          - tuning
          - pgo
          - sprt
          - uci-match
        default: tuning
      selfplay_games:
        description: "nightwing_selfplay: number of self-play games to generate training data from"
        required: false
        default: "5000"
      selfplay_search_depth:
        description: "nightwing_selfplay/nightwing_match: fixed search depth used for every move (shared by both tools so training/eval and the strength-comparison match use the same search strength)"
        required: false
        # Was 4; raised to 6 in Session 152 (docs/DECISIONS.md, 2026-09-29
        # (3)) after Sessions 144-151 traced the mobility/space eval
        # terms' MG-side sign flip to depth-4 self-play specifically —
        # SelfPlayConfig::search_depth's own compiled-in default
        # (src/tuner/selfplay.h) moved to 6 for the same reason, and this
        # manually-triggered pipeline's default is kept in sync with it
        # rather than silently regenerating depth-4 corpora going forward.
        default: "6"
      selfplay_random_opening_plies:
        description: "nightwing_selfplay/nightwing_match: random plies played at the start of each game before real search takes over, for opening variety"
        required: false
        default: "8"
      selfplay_max_plies:
        description: "nightwing_selfplay/nightwing_match: safety cap on game length (plies) before a game is abandoned as a draw"
        required: false
        default: "200"
      tune_iterations:
        description: "nightwing_tune: finite-difference gradient descent iterations (used for material mode and all 6 term modes below — PSQT included, though its own tune_psqt() uses an analytic gradient rather than finite differences, tune.h's own doc comment on why)"
        required: false
        default: "200"
      match_games:
        description: "nightwing_match: number of games played between tuned weights and eval::default_material_weights()"
        required: false
        default: "400"
      sprt_elo0:
        description: "nightwing_sprt: H0 Elo bound (the change is no better than this)"
        required: false
        default: "0"
      sprt_elo1:
        description: "nightwing_sprt: H1 Elo bound (the change is at least this good)"
        required: false
        default: "5"
      sprt_batch_size:
        description: "nightwing_sprt: games played per SPRT check (should be even)"
        required: false
        default: "20"
      sprt_max_games:
        description: "nightwing_sprt: hard safety cap on total games if neither SPRT bound is ever crossed"
        required: false
        default: "2000"

      ucimatch_baseline_ref:
        description: "uci-match: baseline (engine A) git ref -- full 40-char commit SHA, branch, or tag. Default is the parent of the commit that introduced Step 2b (b7d0be8)"
        required: false
        default: "b7d0be8165c1f470c2fd5a2b298e06a6b2f986b3"
      ucimatch_candidate_ref:
        description: "uci-match: candidate (engine B) git ref -- full 40-char commit SHA, branch, or tag. Default main = current main. For Step 2b ALONE, use cdbe1a68f47005a1ffcca1412001d0ce69d0f88c (the Step 2b commit itself)"
        required: false
        default: "main"
      ucimatch_depth:
        description: "uci-match: fixed search depth sent to both engines as `go depth N`"
        required: false
        default: "6"
      ucimatch_movetime_ms:
        description: "uci-match: optional. 0 = fixed depth (ucimatch_depth). Above 0 = `go movetime N` instead, so engine SPEED counts toward strength (a fixed-depth match cannot show a pure speed-up)"
        required: false
        default: "0"
      ucimatch_elo0:
        description: "uci-match: SPRT H0 Elo bound (candidate no better than this)"
        required: false
        default: "-5"
      ucimatch_elo1:
        description: "uci-match: SPRT H1 Elo bound (candidate at least this good)"
        required: false
        default: "5"
      ucimatch_alpha:
        description: "uci-match: SPRT alpha (false-positive rate)"
        required: false
        default: "0.05"
      ucimatch_beta:
        description: "uci-match: SPRT beta (false-negative rate)"
        required: false
        default: "0.05"
      ucimatch_max_games:
        description: "uci-match: hard cap on games if neither SPRT bound is crossed"
        required: false
        default: "4000"
      ucimatch_time_limit_min:
        description: "uci-match: wall-clock limit for the match in minutes (job stops cleanly and reports the partial tally; hosted-runner jobs are capped at 360 minutes in total including builds)"
        required: false
        default: "300"
      ucimatch_opening_plies:
        description: "uci-match: random opening plies per game"
        required: false
        default: "8"
      ucimatch_max_plies:
        description: "uci-match: game-length cap in plies (a game reaching it is a draw)"
        required: false
        default: "300"
      ucimatch_seed:
        description: "uci-match: base seed for the random openings"
        required: false
        default: "1"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            build_type: Release
          - os: ubuntu-latest
            os_name: Linux
            build_type: Debug
          - os: macos-latest
            os_name: macOS
            build_type: Release
          - os: macos-latest
            os_name: macOS
            build_type: Debug
          - os: windows-latest
            os_name: Windows
            build_type: Release
          - os: windows-latest
            os_name: Windows
            build_type: Debug

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_name }} ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ninja needs cl.exe on PATH explicitly -- the Visual Studio generator
      # locates MSVC automatically via its own toolchain-discovery logic,
      # Ninja has no such mechanism and just invokes whatever compiler it's
      # given. egor-tensin/vs-shell does this (a real, actively-used
      # alternative to the more commonly-referenced ilammy/msvc-dev-cmd,
      # switched to specifically because it's implemented in PowerShell, not
      # Node.js -- ilammy/msvc-dev-cmd still declares itself as a Node 20
      # action, which is what brought the "Node.js 20 is deprecated"
      # annotation back after this workflow's earlier, separate Node 20 fix
      # -- actions/checkout@v7, 2026-08-16 entry -- covered a different
      # action entirely). Windows-only; Linux/macOS keep the default
      # Makefiles generator, which already works correctly and isn't part of
      # this change.
      - name: Set up MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      # Ninja's actual availability on GitHub-hosted Windows runners has
      # changed over time and isn't something to assume (see
      # docs/DECISIONS.md's 2026-08-18 entry on this switch for the
      # investigation) -- installing it explicitly via pip is the most
      # reliable option: Python/pip is guaranteed present on every
      # GitHub-hosted runner, and PyPI's `ninja` package is a real binary,
      # not a wrapper around something that might not be there.
      - name: Install Ninja (Windows only)
        if: runner.os == 'Windows'
        run: pip install ninja

      # Windows uses Ninja (see docs/DECISIONS.md's 2026-08-18 entry: the
      # Visual Studio generator represents Debug's compiler flags as
      # structured per-file MSBuild XML properties rather than a plain
      # command line, which is what made board/attacks.cpp's per-file
      # optimization override in src/CMakeLists.txt unreliable to reason
      # about there -- Ninja produces the same flat, literal compiler
      # command line Linux/macOS's Makefiles generator already does, which
      # is what that override is designed around). Linux/macOS are
      # unchanged, using CMake's default generator for their platform.
      - name: Configure CMake
        run: cmake -B build ${{ runner.os == 'Windows' && '-G Ninja' || '' }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNIGHTWING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

      # `ctest --output-on-failure` (the step above) only ever prints a
      # test's own stdout when that test FAILS -- for the regression
      # bench (tests/bench_tests.cpp, `[bench]` tag; docs/ROADMAP.md's
      # own "node-count/strength tracked in SESSIONS.md per change"
      # practice), the whole point is reading its printed `BENCH ...`
      # node-count lines from a PASSING run, which the step above can
      # never surface -- this was silently true from the day that
      # practice was adopted, only noticed once a session actually went
      # looking for those lines in a real CI log and found nothing (see
      # docs/SESSIONS.md, 2026-08-26 (3)/(4)). `-V` (verbose) forces
      # ctest to print a test's output regardless of pass/fail. Scoped to
      # a single matrix leg (Linux Release, chosen arbitrarily among the
      # six -- search is deterministic, so node counts are the same
      # figures the OS/build-type wouldn't be expected to change) rather
      # than repeated six times: the bench numbers are read by a human
      # updating docs/SESSIONS.md, not asserted on by any test, so one
      # copy of them is all that's ever actually useful.
      # ROADMAP.md Priority Fixes (2026-09-22), "CI: also run the raw
      # `nightwing_tests` binary once, non-isolated": ctest runs every test
      # case in its own process, which hides cross-test global-state
      # contamination (the opening-book bug was this class). One direct run
      # of the whole binary in a single process catches it. Linux Release
      # only ("once"): the run takes about 12 seconds there.
      - name: Test, raw binary in a single process (Linux Release only)
        if: matrix.os_name == 'Linux' && matrix.build_type == 'Release'
        working-directory: build
        run: ./tests/nightwing_tests

      - name: Print regression bench (Linux Release only — see comment above)
        if: matrix.os_name == 'Linux' && matrix.build_type == 'Release'
        working-directory: build
        run: ctest -R bench -V --build-config ${{ matrix.build_type }}

      # Release & Packaging Infrastructure (ROADMAP.md, added 2026-08-15):
      # the `release` job below needs each platform's Release-config
      # binary to publish, and a job can only ever consume another job's
      # output via a real artifact upload/download round-trip (matrix
      # legs are separate runners; there's no shared filesystem to just
      # read `build/src/nightwing` off after the fact). Debug legs are
      # deliberately excluded — this project's own CI/test-only Debug
      # (ASan/UBSan) builds aren't something an end user should run, per
      # this same ROADMAP item's own text. `nightwing` is `src/
      # CMakeLists.txt`'s actual executable target name (`add_executable
      # (nightwing main.cpp)`) -- the UCI engine binary itself, not
      # `nightwing_bench`/`nightwing_selfplay`/etc. All three OSes use a
      # single-config generator here (CMake defaults on Linux/macOS,
      # Ninja on Windows — see the "Configure CMake" step's own comment),
      # so the binary always lands directly at `build/src/nightwing[.exe]`
      # with no `Release/` subfolder to account for.
      - name: Upload nightwing binary (Release only)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: nightwing-binary-${{ matrix.os_name }}
          path: build/src/nightwing${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  # ROADMAP.md Priority Fixes (2026-09-22), "ThreadSanitizer coverage":
  # Lazy SMP, the lock-free TT and the background `go`/ponder threads were
  # only ever exercised under ASan/UBSan, which cannot detect data races.
  # This leg builds Debug with -DNIGHTWING_ENABLE_TSAN=ON (-fsanitize=thread,
  # mutually exclusive with ASan/UBSan, hence a separate job rather than a
  # matrix entry) and runs the thread-touching test tags directly via the raw
  # binary. Linux only: TSan support on macOS runners is unreliable and MSVC
  # has none. `[hash]` is excluded: its out-of-range Hash test requests an
  # enormous table and is OOM-killed under TSan's shadow-memory overhead
  # (observed locally in a 4 GB sandbox; unverified on a hosted runner).
  # halt_on_error=1 so a detected race fails the job rather than only logging.
  tsan-test:
    runs-on: ubuntu-latest
    name: Linux Debug (ThreadSanitizer)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build_tsan -DCMAKE_BUILD_TYPE=Debug -DNIGHTWING_ENABLE_TSAN=ON -DNIGHTWING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build_tsan --parallel

      - name: Test (thread-touching tags)
        working-directory: build_tsan
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ./tests/nightwing_tests "[smp],[thread_regression],[persistent_tt],[tt],[pondering],[hashfull],[uci]~[hash]"

  # ROADMAP.md Phase 5's final item ("Tuned weights committed, before/after
  # strength comparison logged") needs a real large-scale run: thousands of
  # nightwing_selfplay games piped into nightwing_tune, then a
  # nightwing_match comparison of the tuned weights against
  # eval::default_material_weights(). This is compute-heavy (thousands of
  # fixed-depth searches), not something to hand-run in a chat sandbox with
  # per-command time limits — src/tuner/selfplay_main.cpp's,
  # src/tuner/tune_main.cpp's, and src/tuner/match_main.cpp's own header
  # comments already document the intended venue for this as "a GitHub
  # Actions workflow_dispatch job", extending this project's existing
  # "GitHub Actions handles ALL building" convention to "and ALL running of
  # anything compute-heavy like this too" (see docs/DECISIONS.md's
  # 2026-08-31 entry for this job itself). Manually triggered only
  # (`workflow_dispatch`, not `push`/
  # `pull_request`) since this is a deliberate, occasional data-generation
  # run, not a per-commit correctness check — it doesn't gate CI and CI's
  # own green status doesn't depend on it. Linux Release only: search is
  # deterministic given a seed, so the OS/build-type matrix build-and-test
  # already exists for isn't a meaningful axis for a strength-tuning run,
  # and running this on all 6 legs would be 6x the compute for zero
  # additional signal.
  tuning-pipeline:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'tuning'
    runs-on: ubuntu-latest
    name: Tuning pipeline (selfplay -> tune -> match)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tests aren't needed for this job — it only runs the three tuner/
      # executables (nightwing_selfplay/nightwing_tune/nightwing_match),
      # none of which are part of the Catch2 test binary. Skipping
      # NIGHTWING_BUILD_TESTS avoids an unnecessary Catch2 FetchContent +
      # compile on a job that's already going to spend most of its time in
      # the actual self-play/tune/match run below, not in the build step.
      - name: Configure CMake (Release, no tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF

      - name: Build tuner executables
        run: cmake --build build --config Release --parallel --target nightwing_selfplay nightwing_tune nightwing_match

      # Positional args, per each tool's own header comment:
      #   nightwing_selfplay [num_games] [base_seed] [search_depth] [random_opening_plies] [max_plies]
      #   nightwing_tune     [iterations] [learning_rate] [finite_diff_epsilon] [sigmoid_scale]
      #   nightwing_match    [num_games] [base_seed] [search_depth] [random_opening_plies] [max_plies]
      # base_seed is fixed (1) for both selfplay and match so a re-run of
      # this workflow with unchanged inputs is exactly reproducible.
      # nightwing_tune's own progress/loss-curve output goes to stderr, not
      # stdout (match_main.cpp's own header comment) — tuned_weights.txt
      # below only ever receives the five "pawn_mg=... pawn_eg=..." lines
      # nightwing_match expects on its stdin.
      - name: Run self-play -> tune -> match pipeline
        working-directory: build
        run: |
          set -euo pipefail
          echo "== nightwing_selfplay: ${{ inputs.selfplay_games }} games =="
          ./src/nightwing_selfplay \
            "${{ inputs.selfplay_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            > training_data.txt
          wc -l training_data.txt

          echo "== nightwing_tune: ${{ inputs.tune_iterations }} iterations =="
          ./src/nightwing_tune "${{ inputs.tune_iterations }}" \
            < training_data.txt > tuned_weights.txt
          cat tuned_weights.txt

          echo "== nightwing_match: tuned vs. default_material_weights(), ${{ inputs.match_games }} games =="
          ./src/nightwing_match \
            "${{ inputs.match_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            < tuned_weights.txt | tee match_result.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuning-pipeline-results
          path: |
            build/training_data.txt
            build/tuned_weights.txt
            build/match_result.txt
          retention-days: 30

  # ROADMAP.md's "Actually run tune_mobility()/tune_space()/tune_threats()/
  # tune_king_safety()/tune_pawns() against real self-play data" item, PLUS
  # PSQT (`--psqt`, `tune_psqt()`) added to this same matrix rather than
  # left out: PSQT was already fully built and CLI-wired (Tier 0 Step 6,
  # tune_main.cpp's own `--psqt` flag) but had never actually been added
  # to this workflow at all — a real gap, not a deliberate scoping choice,
  # noticed only when asked directly "how to Texel-tune the WHOLE thing in
  # GitHub Actions" and checked against this file rather than assumed
  # already covered. PSQT fits this same matrix cleanly despite being
  # algorithmically different (analytic gradient, tune.h's own doc
  # comment, vs. finite-difference for the other five): tune_main.cpp's
  # own CLI dispatch treats `--psqt` exactly like any other mode flag
  # (same positional-argument slot, same internal `TuneConfig::learning_rate`
  # override handled inside tune_main.cpp itself, not something this
  # workflow needs to special-case), and — measured directly, not assumed
  # — PSQT's own per-iteration cost is roughly `1/(2N+1)` of a
  # finite-difference term's at the same N, since an analytic gradient is
  # ONE pass over the training data per iteration rather than `2N+1`
  # (tune.h's own header comment on why PSQT specifically got an analytic
  # path in the first place): ~26 minutes at this workflow's own
  # 5000-game/200-iteration defaults, the cheapest leg in this entire
  # matrix despite having by far the most parameters (768). No
  # `nightwing_match` counterpart for PSQT either, same reason as the
  # other five (`tuner::match.h`'s own `eval::MaterialWeights`-only
  # scope) — and PSQT's own tuned result is a per-square 8x8 grid, not
  # `name=value` lines (`print_psqt_field()`, tune_main.cpp), written to
  # stderr rather than stdout, so `tuned_weights.txt` for this leg will be
  # an empty file; that's expected, not a bug — the real output is in
  # `tune_stderr.txt`.
  #
  # ROADMAP.md's "Actually run tune_mobility()/tune_space()/tune_threats()/
  # tune_king_safety()/tune_pawns() against real self-play data" item. A
  # SEPARATE job per mode (matrix strategy below), not extra steps tacked
  # onto tuning-pipeline above, for a real, measured reason: a single
  # GitHub-hosted job has a hard 6-hour execution ceiling, and these five
  # terms' own parameter counts vary by an order of magnitude (space: 2,
  # pawns: 59) — compute_loss()'s own cost scales with TRAINING POSITION
  # COUNT, walked 2*N+1 times per tuning iteration (finite-difference), so
  # a 59-parameter table costs ~30x a 2-parameter one at the same
  # iteration count. Measured directly (this session, a real build, a
  # 732-position corpus, 20 iterations per mode) and scaled linearly to
  # this workflow's own 5000-game/200-iteration defaults: pawns alone
  # comes out to roughly 2.5-3 hours by itself, and mobility+space+
  # threats+king-safety+pawns run SEQUENTIALLY in one job (as an earlier
  # version of this workflow briefly had it) sums to close enough to 6
  # hours — before self-play/material-tune/match's own time, and before
  # checkout/build/artifact-upload overhead — that a real dispatch risks
  # the job being killed by the platform ceiling with NOTHING uploaded,
  # including modes that finished fine minutes earlier. Splitting into
  # independent jobs fixes this two ways at once: GitHub runs independent
  # jobs concurrently (account concurrency limits permitting), so total
  # WALL-CLOCK time drops to roughly the slowest single mode (pawns, ~3
  # hours) instead of the sum of all six: and each job gets its own full
  # 6-hour ceiling and its own artifact upload, so one mode running long
  # or failing doesn't cost the others their results.
  #
  # Each job regenerates training_data.txt itself with the SAME
  # selfplay_games/selfplay_search_depth/selfplay_random_opening_plies/
  # selfplay_max_plies inputs and the same fixed base_seed=1 the
  # tuning-pipeline job above uses — nightwing_selfplay is fully
  # deterministic given identical inputs (tuner/selfplay.h's own header
  # comment), so this produces the EXACT SAME corpus tuning-pipeline's own
  # material run trains against, not a separately-drawn, not-directly-
  # comparable one, without needing cross-job artifact hand-off (a real
  # option too, but a second job dependency/download step for a
  # regeneration this cheap — ~6 minutes of this job's own multi-hour
  # budget — isn't worth the added coupling). No nightwing_match
  # counterpart here: tuner::match.h is deliberately scoped to
  # eval::MaterialWeights only (its own header comment) — generalizing it
  # is a distinct, not-yet-scoped future item, out of reach of this one.
  tuning-pipeline-term:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'tuning'
    runs-on: ubuntu-latest
    # `name:` is the string GitHub's own run-summary UI shows per matrix
    # leg (the "Matrix: tuning-pipeline-term" list on the Actions run
    # page) -- `matrix.label` (a small, explicit include-list below,
    # NOT derived from `matrix.mode` via string manipulation, since
    # GitHub Actions expressions have no built-in capitalize()) exists
    # so that list reads as a short, unambiguous "Mobility"/"Space"/
    # "Threats"/"King-safety"/"Pawns"/"PSQT" rather than a long, mobile-
    # UI-truncating "Tuning pipeline, king-saf..." this job's own name
    # used before. `matrix.mode` (still the actual `--mode` value the
    # step below passes to nightwing_tune) is unchanged.
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: psqt
            label: PSQT
          - mode: mobility
            label: Mobility
          - mode: space
            label: Space
          - mode: threats
            label: Threats
          - mode: king-safety
            label: King-safety
          - mode: pawns
            label: Pawns

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake (Release, no tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF

      - name: Build tuner executables
        run: cmake --build build --config Release --parallel --target nightwing_selfplay nightwing_tune

      # Same positional args as tuning-pipeline's own step above; see that
      # step's own comment for the full reference. nightwing_tune's
      # `--${{ matrix.mode }}` must be its own separate argument, before
      # `tune_iterations` (tune_main.cpp's own CLI-mode-must-be-argv[1]
      # convention, tuner/tune_main.cpp's own header comment).
      - name: Run self-play -> tune (${{ matrix.mode }}) pipeline
        working-directory: build
        run: |
          set -euo pipefail
          echo "== nightwing_selfplay: ${{ inputs.selfplay_games }} games =="
          ./src/nightwing_selfplay \
            "${{ inputs.selfplay_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            > training_data.txt
          wc -l training_data.txt

          echo "== nightwing_tune --${{ matrix.mode }}: ${{ inputs.tune_iterations }} iterations =="
          ./src/nightwing_tune "--${{ matrix.mode }}" "${{ inputs.tune_iterations }}" \
            < training_data.txt > tuned_weights.txt 2> tune_stderr.txt
          cat tuned_weights.txt
          tail -40 tune_stderr.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuning-pipeline-${{ matrix.mode }}-results
          path: |
            build/tuned_weights.txt
            build/tune_stderr.txt
          retention-days: 30

  # ROADMAP.md Phase 8's "PGO build pipeline" item. Manually triggered
  # only (`workflow_dispatch`, same rationale as `tuning-pipeline` above)
  # -- a two-stage PGO build is a deliberate, occasional release-quality
  # step, not a per-commit correctness check, and doesn't gate regular
  # CI. Linux only: PGO here is GCC/Clang-only by design (see
  # CMakeLists.txt's own NIGHTWING_PGO_PHASE comment for why MSVC is out
  # of scope this session), and a single representative platform is
  # enough to validate the pipeline itself works — this job produces a
  # downloadable artifact for whoever wants the actual optimized binary,
  # not a cross-platform correctness matrix (build-and-test above
  # already covers that, without PGO).
  #
  # CRITICAL: both cmake invocations below target the SAME build
  # directory (`build`) and never rename the `nightwing` executable
  # target — see CMakeLists.txt's own NIGHTWING_PGO_PHASE comment for
  # why either one breaks GCC's own profile-file-to-binary-name
  # association silently (produces a working but NON-PGO-optimized
  # binary with a full set of masked "missing profile" warnings, not a
  # build failure — the kind of mistake that's easy to ship unnoticed).
  pgo-build:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'pgo'
    runs-on: ubuntu-latest
    name: PGO build pipeline (generate -> train -> use -> verify)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake (Release, PGO generate phase)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF -DNIGHTWING_PGO_PHASE=generate

      - name: Build instrumented engine
        run: cmake --build build --config Release --parallel --target nightwing

      # Training workload: the same fixed bench positions this project
      # already uses for regression tracking (src/bench_positions.h),
      # plus a couple of ordinary `go` searches from both the starting
      # position and a short reply, specifically so the opening book
      # (book.cpp — `bench` alone never touches it, since
      # search_fixed_depth() bypasses book entirely) also gets real
      # profile coverage, not just left to `-Wno-missing-profile` to
      # paper over. Verified directly, in a development sandbox before
      # this job was written, that this exact combination already
      # exercises every single .cpp file in nightwing_lib.
      - name: Run training workload
        working-directory: build
        run: |
          ./src/nightwing bench
          printf 'uci\nposition startpos\ngo depth 8\nposition startpos moves e2e4 e7e5\ngo depth 8\nquit\n' | ./src/nightwing

      # Reconfigures the SAME build directory in place (this step's own
      # job-level comment above has the full reasoning on why this
      # matters) -- also turns tests on now, so the verification step
      # below builds and runs the PGO-optimized library, not a second,
      # separate non-PGO copy of it.
      - name: Reconfigure CMake (PGO use phase, tests on)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=ON -DNIGHTWING_PGO_PHASE=use

      - name: Rebuild optimized engine and test suite
        run: cmake --build build --config Release --parallel

      # Confirms the PGO-optimized nightwing_lib is still correct, not
      # just faster -- PGO only changes codegen/optimization decisions,
      # never program logic, so every existing test should still pass
      # unchanged; a failure here would mean something about this
      # pipeline itself (not an ordinary code change) broke correctness.
      - name: Test PGO-optimized build
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      # `bench`'s own "Nodes searched" total is a genuine correctness
      # cross-check, not just informational here: PGO must never change
      # WHAT the engine computes, only how fast — an unexpected total
      # here (versus the plain, non-PGO build-and-test job's own bench
      # numbers, docs/SESSIONS.md) would indicate this pipeline
      # introduced a real behavioral difference, not just a speed one.
      - name: Run bench on the PGO-optimized binary
        working-directory: build
        run: ./src/nightwing bench

      - name: Upload PGO-optimized binary
        uses: actions/upload-artifact@v4
        with:
          name: nightwing-pgo-linux
          path: build/src/nightwing
          retention-days: 30

  # ROADMAP.md Phase 8's "SPRT testing setup/process for validating future
  # changes" item. Manually triggered only (`workflow_dispatch`, same
  # rationale as `tuning-pipeline`/`pgo-build` above) — an SPRT run is a
  # deliberate, occasional strength-validation step for a specific proposed
  # change, not a per-commit correctness check. Linux Release only, same
  # "search is deterministic given a seed, cross-platform isn't a
  # meaningful axis here" reasoning as `tuning-pipeline`.
  #
  # This job demonstrates the actual end-to-end process a future session
  # (or person) can reuse to validate ANY proposed change with a real
  # accept/reject decision rather than a fixed-game match's bare point
  # estimate (tuner::match.h's own header comment on the difference,
  # tuner::sprt.h's own header comment on the method): here, self-play ->
  # tune produces a candidate weight vector, and nightwing_sprt (not
  # nightwing_match) is what decides whether it's actually worth adopting.
  # The identical nightwing_sprt tool works just as well standing alone,
  # fed any other candidate eval::MaterialWeights on stdin — the self-play/
  # tune steps above it in this job are one example producer of a
  # candidate to test, not a requirement of the SPRT process itself.
  sprt-test:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'sprt'
    runs-on: ubuntu-latest
    name: SPRT pipeline (selfplay -> tune -> sprt)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake (Release, no tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF

      - name: Build tuner executables
        run: cmake --build build --config Release --parallel --target nightwing_selfplay nightwing_tune nightwing_sprt

      # Positional args:
      #   nightwing_selfplay [num_games] [base_seed] [search_depth] [random_opening_plies] [max_plies]
      #   nightwing_tune     [iterations] [learning_rate] [finite_diff_epsilon] [sigmoid_scale]
      #   nightwing_sprt     [elo0] [elo1] [alpha] [beta] [batch_size] [max_games]
      #                      [base_seed] [search_depth] [random_opening_plies] [max_plies]
      # (sprt_main.cpp's own header comment has the full list.) base_seed
      # is fixed (1) for both selfplay and the SPRT run so a re-run of this
      # workflow with unchanged inputs is exactly reproducible. alpha/beta
      # are left at nightwing_sprt's own defaults (0.05/0.05, the
      # conventional Fishtest-style error rates) — not exposed as separate
      # workflow_dispatch inputs, since changing them changes what
      # "accept"/"reject" statistically MEANS, not just how long the test
      # runs; the four inputs that are exposed (elo0/elo1/batch_size/
      # max_games) are the ones that vary run-to-run for a genuinely
      # different question being asked, not the test's own error-rate
      # calibration.
      - name: Run self-play -> tune -> SPRT pipeline
        working-directory: build
        run: |
          set -euo pipefail
          echo "== nightwing_selfplay: ${{ inputs.selfplay_games }} games =="
          ./src/nightwing_selfplay \
            "${{ inputs.selfplay_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            > training_data.txt
          wc -l training_data.txt

          echo "== nightwing_tune: ${{ inputs.tune_iterations }} iterations =="
          ./src/nightwing_tune "${{ inputs.tune_iterations }}" \
            < training_data.txt > tuned_weights.txt
          cat tuned_weights.txt

          echo "== nightwing_sprt: tuned vs. default_material_weights(), elo0=${{ inputs.sprt_elo0 }} elo1=${{ inputs.sprt_elo1 }} =="
          ./src/nightwing_sprt \
            "${{ inputs.sprt_elo0 }}" "${{ inputs.sprt_elo1 }}" 0.05 0.05 \
            "${{ inputs.sprt_batch_size }}" "${{ inputs.sprt_max_games }}" 1 \
            "${{ inputs.selfplay_search_depth }}" \
            "${{ inputs.selfplay_random_opening_plies }}" \
            "${{ inputs.selfplay_max_plies }}" \
            < tuned_weights.txt | tee sprt_result.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprt-pipeline-results
          path: |
            build/training_data.txt
            build/tuned_weights.txt
            build/sprt_result.txt
          retention-days: 30

  # ROADMAP.md Priority Fixes (2026-09-22), "Engine-vs-engine match
  # infrastructure for search-code changes" -- first real use: the
  # "Staged / lazy move generation" item's Step 3b. Manually triggered only
  # (`workflow_dispatch`, same rationale as `sprt-test`). Unlike `sprt-test`,
  # which compares eval weights inside ONE binary, this builds TWO separate
  # engine binaries from two git refs and plays them against each other
  # over UCI with `nightwing_uci_match` (src/tuner/uci_match_main.cpp), so
  # it can compare two versions of the search code itself. The runner tool
  # is always built from the ref this workflow was dispatched on; the two
  # engines are built from `ucimatch_baseline_ref` / `ucimatch_candidate_ref`.
  # All settings arrive as `env:` values rather than being interpolated into
  # the script text, so a free-text input cannot inject shell commands.
  uci-match-test:
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'uci-match'
    runs-on: ubuntu-latest
    name: UCI match (baseline vs. candidate, SPRT)
    timeout-minutes: 355

    env:
      BASELINE_REF: ${{ inputs.ucimatch_baseline_ref }}
      CANDIDATE_REF: ${{ inputs.ucimatch_candidate_ref }}
      DEPTH: ${{ inputs.ucimatch_depth }}
      MOVETIME_MS: ${{ inputs.ucimatch_movetime_ms }}
      ELO0: ${{ inputs.ucimatch_elo0 }}
      ELO1: ${{ inputs.ucimatch_elo1 }}
      ALPHA: ${{ inputs.ucimatch_alpha }}
      BETA: ${{ inputs.ucimatch_beta }}
      MAX_GAMES: ${{ inputs.ucimatch_max_games }}
      TIME_LIMIT_MIN: ${{ inputs.ucimatch_time_limit_min }}
      OPENING_PLIES: ${{ inputs.ucimatch_opening_plies }}
      MAX_PLIES: ${{ inputs.ucimatch_max_plies }}
      SEED: ${{ inputs.ucimatch_seed }}

    steps:
      - name: Checkout runner (the ref this workflow was dispatched on)
        uses: actions/checkout@v7
        with:
          path: runner

      - name: Checkout baseline (engine A)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ucimatch_baseline_ref }}
          path: baseline

      - name: Checkout candidate (engine B)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ucimatch_candidate_ref }}
          path: candidate

      - name: Show the three commits
        run: |
          echo "runner   : $(git -C runner log -1 --format='%H %s')"
          echo "baseline : $(git -C baseline log -1 --format='%H %s')"
          echo "candidate: $(git -C candidate log -1 --format='%H %s')"

      - name: Build runner
        run: |
          cmake -S runner -B runner/build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF
          cmake --build runner/build --config Release --parallel --target nightwing_uci_match_cli

      - name: Build baseline engine
        run: |
          cmake -S baseline -B baseline/build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF
          cmake --build baseline/build --config Release --parallel --target nightwing

      - name: Build candidate engine
        run: |
          cmake -S candidate -B candidate/build -DCMAKE_BUILD_TYPE=Release -DNIGHTWING_BUILD_TESTS=OFF
          cmake --build candidate/build --config Release --parallel --target nightwing

      # Engine A = baseline, engine B = candidate: nightwing_uci_match
      # reports the SPRT from B's side, so AcceptH1 means the candidate
      # is better. Exit code 124 is `timeout` stopping the match at the
      # wall-clock limit: that is an inconclusive result, not a failure,
      # and the partial tally is recovered from the progress log below.
      # Exit code 3 is the runner reporting an engine crash/timeout.
      - name: Run UCI match
        run: |
          set +e
          CONTROL=(--depth "$DEPTH")
          if [ "$MOVETIME_MS" -gt 0 ]; then
            CONTROL=(--movetime "$MOVETIME_MS")
          fi
          timeout --signal=TERM "${TIME_LIMIT_MIN}m" \
            ./runner/build/src/nightwing_uci_match \
            "$PWD/baseline/build/src/nightwing" "$PWD/candidate/build/src/nightwing" \
            --games "$MAX_GAMES" "${CONTROL[@]}" \
            --opening-plies "$OPENING_PLIES" --max-plies "$MAX_PLIES" --seed "$SEED" \
            --sprt "$ELO0" "$ELO1" "$ALPHA" "$BETA" \
            > match_result.txt 2> >(tee match_progress.log >&2)
          rc=$?
          set -e
          echo "runner exit code: $rc"
          {
            echo "## UCI match: baseline vs. candidate (SPRT ${ELO0} / ${ELO1}, alpha ${ALPHA}, beta ${BETA}, ${CONTROL[*]})"
            echo
            echo "- baseline : \`$(git -C baseline rev-parse HEAD)\`"
            echo "- candidate: \`$(git -C candidate rev-parse HEAD)\`"
            echo
            if [ "$rc" -eq 124 ]; then
              echo "**Stopped at the ${TIME_LIMIT_MIN}-minute limit -- inconclusive.** Last progress lines:"
              echo '```'
              tail -n 4 match_progress.log
              echo '```'
            else
              echo '```'
              cat match_result.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat match_result.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

      - name: Upload match results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uci-match-results
          path: |
            match_result.txt
            match_progress.log
          retention-days: 30

  # ROADMAP.md's "Release & Packaging Infrastructure" section (added
  # 2026-08-15), Emscripten toolchain integration item. Builds the
  # `nightwing` UCI engine (only -- see NIGHTWING_BUILD_WASM's own doc
  # comment, root CMakeLists.txt, for why the other 5 tools are excluded)
  # as WebAssembly, using the official emsdk via mymindstorm/setup-emsdk
  # -- NOT the ad hoc, dependency-conflict-forced, years-old apt package
  # this item's own local development and testing had to fall back to in
  # a sandbox without access to the official emsdk's own download servers
  # (docs/SESSIONS.md, Session 158). That gap matters concretely: local
  # testing surfaced a real cross-compile bug (BMI2/PEXT code compiling
  # in under Emscripten, now fixed in src/CMakeLists.txt) and a real
  # Node/fetch incompatibility (now fixed via -sWASM_ASYNC_COMPILATION=0),
  # both already folded into the CMake config below -- but it ALSO hit a
  # third, unresolved symptom (the compiled binary running but executing
  # no UCI logic at all) that could not be conclusively root-caused
  # within that session's budget, and might be specific to that one
  # broken local toolchain rather than a real defect here. The smoke-test
  # step below exists specifically to catch that exact failure mode (or
  # confirm its absence) against the real, properly-obtained toolchain a
  # CI runner gets -- this job's own output is the actual verification
  # that toolchain-integration item needed and didn't have.
  wasm-build:
    name: WebAssembly build (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure CMake (wasm)
        run: emcmake cmake -B build-wasm -DNIGHTWING_BUILD_WASM=ON -DNIGHTWING_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        run: cmake --build build-wasm -j$(nproc)

      # This is the check that actually matters for this item: a build
      # that merely "succeeds" (exit code 0, files produced) is not
      # evidence the binary DOES anything -- Session 158's own local
      # testing produced exactly such a silently-inert binary.
      #
      # ROADMAP.md's "Verify the wasm build against the existing UCI
      # test suite (or an equivalent subset runnable under Node) before
      # it's trusted as a real release asset, not just 'compiles'" item
      # (Session 161): a single scenario (the original version of this
      # step) only proved the loop ran at all, not that the actual UCI
      # protocol surface worked. Porting tests/uci_tests.cpp's full
      # Catch2 suite to run under Node is a much bigger undertaking than
      # this item's own "or an equivalent subset" wording asks for, so
      # this step instead runs several independent short UCI sessions,
      # each checking ONE behavior also covered natively by
      # tests/uci_tests.cpp (named in each comment below) -- a real,
      # if partial, cross-check that the wasm build's UCI behavior
      # matches the native build's, not just that it starts up.
      - name: Verify the wasm UCI protocol surface under Node
        working-directory: build-wasm/src
        run: |
          # Collects every failure instead of stopping at the first one
          # (ROADMAP.md's sign-flip investigation and this very item's
          # own Sessions 162-163 learned the same lesson the hard way:
          # each real-CI round-trip here costs a full session, so a
          # single run should report everything it can, not just the
          # first failure, cutting the number of round-trips needed to
          # see the full picture). FAILED accumulates short descriptions;
          # the job still fails at the end if it's non-empty. `|| true`
          # on the `node` invocation itself (Session 165, after a real
          # run showed `set -e` silently killing the WHOLE script,
          # skipping every check after the one whose `node` process
          # crashed outright -- a wrong-output failure, caught by this
          # function's own `if`, is NOT the same as the underlying
          # process itself dying with a non-zero exit code, which
          # bypasses this function's own error handling entirely via
          # bash's own `set -e` on the assignment statement) -- a
          # crashed check still produces empty/partial `$output`, so it
          # correctly shows up as a normal failure below rather than
          # silently amputating every check that would have run after it.
          FAILED=()
          check() {
            local desc="$1" input="$2" pattern="$3"
            local output
            output="$(printf "%b" "$input" | timeout 30 node nightwing.js)" || true
            if echo "$output" | grep -qE "$pattern"; then
              echo "PASS: $desc"
            else
              echo "$output"
              echo "::error::wasm UCI check failed: $desc (expected to match /$pattern/)"
              FAILED+=("$desc")
            fi
          }

          # tests/uci_tests.cpp: "'uci' command responds with id and uciok"
          check "uci handshake" 'uci\nquit\n' '^uciok$'

          # tests/uci_tests.cpp: "'isready' responds with readyok"
          check "isready" 'isready\nquit\n' '^readyok$'

          # tests/uci_tests.cpp: "'position startpos moves ...' applies
          # the moves before searching"
          check "position + moves + go" \
            'position startpos moves e2e4 e7e5\ngo depth 3\nquit\n' \
            '^bestmove [a-h][1-8][a-h][1-8]'

          # tests/uci_tests.cpp: "'position fen ...' for an already-
          # checkmated position returns bestmove 0000"
          check "checkmate position" \
            'position fen rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR w KQkq - 1 3\ngo depth 3\nquit\n' \
            '^bestmove 0000$'

          # Diagnostic only, not from tests/uci_tests.cpp: Session 163's
          # real CI run showed `bestmove` printing correctly but NO
          # `info` lines at all from an ordinary `go depth 3` -- both are
          # documented (src/uci/uci.cpp) as written from the SAME
          # background search thread through the SAME mutex-protected
          # stream, which makes that asymmetry genuinely puzzling rather
          # than something this project has a confident fix for yet
          # (docs/ROADMAP.md has the full writeup). This check exists to
          # narrow the next real CI result down precisely -- "zero info
          # lines ever" vs. "info lines exist but something about their
          # content/count is wrong" are different bugs with different
          # fixes, and the MultiPV check two lines down can't tell them
          # apart on its own.
          # RESOLVED (Session 166): the "puzzle" was never a wasm bug.
          # start_go() (src/uci/uci.cpp) consults the opening book
          # (src/book/book.h) BEFORE any search thread exists, and
          # `position startpos` is book-covered -- a book hit prints
          # `bestmove` immediately with no search and therefore no
          # `info` lines, natively and under wasm alike (reproduced
          # natively). This check and the MultiPV one below therefore
          # use a deliberately out-of-book position (the standard
          # "Kiwipete" perft position, CPW) so a real search runs.
          check "any info line appears during an ordinary search" \
            'position fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1\ngo depth 3\nquit\n' \
            '^info '

          # tests/uci_tests.cpp: "'setoption name MultiPV value N'
          # followed by 'go' emits N distinct 'multipv' lines"
          check "MultiPV 3" \
            'setoption name MultiPV value 3\nposition fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1\ngo depth 3\nquit\n' \
            'multipv 3'

          # tests/uci_tests.cpp: "an out-of-range 'setoption name Hash
          # value ...' is clamped, not rejected"
          check "out-of-range Hash is clamped, not rejected" \
            'setoption name Hash value 999999\nisready\nquit\n' \
            '^readyok$'

          # tests/uci_tests.cpp: "'ucinewgame' resets to the starting
          # position"
          check "ucinewgame + go" \
            'position startpos moves e2e4\nucinewgame\ngo depth 2\nquit\n' \
            '^bestmove [a-h][1-8][a-h][1-8]'

          # tests/uci_tests.cpp: "unrecognized commands are silently
          # ignored, not fatal"
          check "malformed input doesn't break later commands" \
            'not a real uci command\nisready\nquit\n' \
            '^readyok$'

          if [ ${#FAILED[@]} -eq 0 ]; then
            echo "All wasm UCI protocol checks passed."
          else
            echo "::error::${#FAILED[@]} wasm UCI check(s) failed: ${FAILED[*]}"
            exit 1
          fi

      # ROADMAP.md's "Standalone `nightwing.min.js`" item (Session 169):
      # a second, separate build of the same wasm target with
      # NIGHTWING_WASM_SINGLE_FILE=ON (wasm inlined as base64 in one JS
      # file). Its own build directory keeps the two-file build above
      # untouched.
      - name: Configure CMake (wasm, single file)
        run: emcmake cmake -B build-wasm-single -DNIGHTWING_BUILD_WASM=ON -DNIGHTWING_WASM_SINGLE_FILE=ON -DNIGHTWING_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release .

      - name: Build (wasm, single file)
        run: cmake --build build-wasm-single -j$(nproc)

      # What makes this bundle worth shipping is that ONE file runs with
      # no asset-path configuration, so this step copies it ALONE into an
      # otherwise empty directory (no `.wasm`, no `nightwing.js`) and
      # runs it from there. The `go` checks matter most: every `go`
      # starts a pthread worker, which re-loads this same file as its
      # worker script, so they exercise the inlined-wasm + threads
      # combination rather than assuming it works. The checks reuse the
      # out-of-book Kiwipete position (see the `info`-line check above)
      # so a real search runs.
      - name: Verify the single-file bundle runs standalone
        run: |
          set -u
          test ! -e build-wasm-single/src/nightwing.wasm || { echo "::error::single-file build still emitted a separate .wasm"; exit 1; }
          test -f build-wasm-single/src/nightwing.min.js || { echo "::error::nightwing.min.js was not produced"; exit 1; }
          ls -l build-wasm-single/src/nightwing.min.js
          echo "line count (informational, minification check): $(wc -l < build-wasm-single/src/nightwing.min.js)"
          rm -rf /tmp/dropin && mkdir /tmp/dropin
          cp build-wasm-single/src/nightwing.min.js /tmp/dropin/
          cd /tmp/dropin
          ls
          FAILED=()
          check() {
            local desc="$1" input="$2" pattern="$3"
            local output
            output="$(printf "%b" "$input" | timeout 60 node nightwing.min.js)" || true
            if echo "$output" | grep -qE "$pattern"; then
              echo "PASS: $desc"
            else
              echo "$output"
              echo "::error::single-file wasm check failed: $desc (expected to match /$pattern/)"
              FAILED+=("$desc")
            fi
          }
          check "uci handshake" 'uci\nquit\n' '^uciok$'
          check "isready" 'isready\nquit\n' '^readyok$'
          check "real search emits info lines (worker thread from single file)" \
            'position fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1\ngo depth 3\nquit\n' \
            '^info '
          check "search ends with a bestmove" \
            'position fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1\ngo depth 3\nquit\n' \
            '^bestmove [a-h][1-8][a-h][1-8]'
          check "OwnBook false forces a real search from startpos" \
            'setoption name OwnBook value false\nposition startpos\ngo depth 3\nquit\n' \
            '^info '
          check "out-of-range Hash is clamped, not rejected" \
            'setoption name Hash value 99999\nisready\nquit\n' \
            '^readyok$'
          if [ ${#FAILED[@]} -eq 0 ]; then
            echo "All single-file wasm checks passed."
          else
            echo "::error::${#FAILED[@]} single-file wasm check(s) failed: ${FAILED[*]}"
            exit 1
          fi

      # Both wasm builds are staged into one flat directory so the
      # artifact has a predictable layout (upload-artifact otherwise
      # preserves the common-ancestor path of its inputs, which would
      # bury these under build-*/src/). The release job below downloads
      # this artifact. `nightwing.js` finds `nightwing.wasm` by that exact
      # filename (Emscripten's glue), so those two keep their names.
      - name: Stage wasm artifacts
        run: |
          mkdir -p wasm-assets
          cp build-wasm/src/nightwing.js build-wasm/src/nightwing.wasm wasm-assets/
          cp build-wasm-single/src/nightwing.min.js wasm-assets/
          ls -l wasm-assets

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightwing-wasm
          path: wasm-assets/
          if-no-files-found: error

  # ROADMAP.md's "Release & Packaging Infrastructure" section (added
  # 2026-08-15): a rolling `latest` GitHub Release, re-published on every
  # green push to `main`, carrying the 3 Release-config native binaries as
  # assets. Gated with `needs: build-and-test` -- a job-level `needs:` on a
  # matrixed job waits for EVERY leg of that matrix (all 6: 3 OS x
  # Release/Debug) to finish, not just the Release ones, which is what
  # "gated with needs: on all 6 existing build+test matrix jobs" (this
  # item's own ROADMAP text) actually means in GitHub Actions terms -- a
  # second job name to depend on isn't needed or possible here, since
  # build-and-test is already one job with 6 matrix legs, not 6 jobs.
  # `if:` restricts this to real pushes to `main`, never PRs (a PR's own
  # build-and-test legs still run and gate merge as normal; they just
  # don't trigger a release) and never the four `workflow_dispatch`
  # pipelines above (those are data-generation/verification runs, not
  # release-worthy commits by themselves).
  release:
    # Also gated on `wasm-build` (Session 169): the wasm files are now
    # release assets, and ROADMAP.md requires the wasm build to be
    # verified before it is trusted as one. A failing wasm build
    # therefore blocks publishing (the native binaries included).
    needs: [build-and-test, wasm-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Publish rolling "latest" release
    permissions:
      contents: write
    # `gh` resolves which repo to talk to from an explicit `GH_REPO`/`-R`
    # first, falling back to inferring it from the current directory's git
    # remote only if that's absent -- this job has no `actions/checkout`
    # step (it only ever touches downloaded artifacts, never the repo's
    # source), so there is no `.git` directory to infer from, which is
    # exactly what broke the first real run of this job (see
    # docs/SESSIONS.md, Session 157: `gh release delete`/`gh release
    # create` both failed with "fatal: not a git repository"). Setting
    # `GH_REPO` here, once, covers every `gh` call in every step below
    # without adding a checkout step this job doesn't otherwise need.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Needed only to read the project's version number out of
      # CMakeLists.txt for the versioned-release tag below -- sparse
      # checkout of just that one file keeps this fast and avoids
      # pulling the whole repo into a job that otherwise never touches
      # source (it only handles downloaded binaries and calls `gh`).
      - name: Checkout CMakeLists.txt (for version number)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: nightwing-binary-Linux
          path: linux-binary

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: nightwing-binary-macOS
          path: macos-binary

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: nightwing-binary-Windows
          path: windows-binary

      - name: Download wasm files
        uses: actions/download-artifact@v4
        with:
          name: nightwing-wasm
          path: wasm-files

      # Consistently-named release assets (this item's own ROADMAP text),
      # distinct from the upload-artifact names above -- those only ever
      # need to be unique per matrix leg for this workflow's own internal
      # upload/download round-trip; these are the public, permanent names
      # an end user downloads from the repo's Releases page.
      - name: Rename binaries to their release-asset names
        run: |
          mkdir -p release-assets
          cp linux-binary/nightwing release-assets/nightwing-linux
          cp macos-binary/nightwing release-assets/nightwing-macos
          cp windows-binary/nightwing.exe release-assets/nightwing-windows.exe
          chmod +x release-assets/nightwing-linux release-assets/nightwing-macos
          # wasm assets keep their build names: nightwing.js loads
          # nightwing.wasm by that exact filename, so the pair must
          # stay together; nightwing.min.js is the standalone bundle.
          cp wasm-files/nightwing.js wasm-files/nightwing.wasm wasm-files/nightwing.min.js release-assets/
          ls -l release-assets

      # `gh release`, not a third-party publishing action: it's
      # preinstalled and pre-authenticated (via GITHUB_TOKEN, which the
      # `contents: write` permission above grants release-publishing
      # rights to) on every GitHub-hosted runner, so there's no extra
      # action version to pin/trust for something this simple. Deleting
      # any previous `latest` release/tag first (rather than trying to
      # update one in place) is what makes this a genuine ROLLING
      # release: `gh release create` alone would fail on the second and
      # every subsequent run once the `latest` tag already exists.
      # `|| true` only covers the very first-ever run of this job, where
      # no `latest` release exists yet to delete -- `gh release delete`
      # exiting non-zero in that one case is expected, not a real
      # failure, and must not fail the step.
      - name: Delete previous "latest" release (if any)
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish "latest" release
        run: |
          gh release create latest release-assets/* \
            --title "Nightwing (rolling latest)" \
            --notes "Automatically published from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC'). This is a rolling release: it always reflects the latest green build on main, not a fixed version." \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # A second, DISTINCT release alongside "latest" above: an
      # immutable, uniquely-tagged versioned release, created fresh every
      # time (never deleted/overwritten, unlike "latest") so past builds
      # stay individually downloadable and referenceable by tag.
      #
      # Tag format: `vMAJOR.MINOR.BUILD`, e.g. `v1.0.680` (changed from
      # `v0.1.0-680`). MAJOR.MINOR comes from `project(nightwing VERSION
      # X.Y ...)` in CMakeLists.txt -- the one hand-edited part, a human
      # judgment this workflow cannot make. BUILD is `github.run_number`
      # (a plain integer, unique and strictly increasing for every run of
      # this workflow), which makes each tag distinct and keeps counting
      # across MAJOR.MINOR bumps rather than resetting.
      #
      # CMakeLists.txt reads the same number from GITHUB_RUN_NUMBER (set
      # automatically in every job) when building, so the binaries'
      # UCI `id name` string reads `Nightwing 1.0.680` and matches this
      # tag. Older `v0.1.0-N` releases are left untouched.
      - name: Compute version tag
        id: version
        run: |
          MAJOR_MINOR=$(grep -oP 'project\(nightwing VERSION \K[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ -z "${MAJOR_MINOR}" ]; then
            echo "::error::could not read MAJOR.MINOR from CMakeLists.txt"
            exit 1
          fi
          echo "tag=v${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No delete-first step here (unlike "latest" above) -- this tag is
      # unique by construction (run_number never repeats), so `gh
      # release create` on it can never collide with a prior run.
      - name: Publish versioned release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" release-assets/* \
            --title "Nightwing ${{ steps.version.outputs.tag }}" \
            --notes "Commit ${{ github.sha }}, built $(date -u +'%Y-%m-%d %H:%M UTC'). This is an immutable, uniquely-tagged release; see the 'latest' release for the rolling always-current build instead." \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
