name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            build_type: Release
          - os: ubuntu-latest
            os_name: Linux
            build_type: Debug
          - os: macos-latest
            os_name: macOS
            build_type: Release
          - os: macos-latest
            os_name: macOS
            build_type: Debug
          - os: windows-latest
            os_name: Windows
            build_type: Release
          - os: windows-latest
            os_name: Windows
            build_type: Debug

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_name }} ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNIGHTWING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}
